<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>.WDD 131 - W05 Assignment: Product Review Form</title>
  <meta name="description" content="WDD 131 - W05 Assignment: Product Review Form Page">
  <meta name="author" content="Ovidio J. Luces M.">
  <link rel="stylesheet" href="styles/form-small.css">
  <link rel="stylesheet" href="styles/form-large.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <script src="scripts/form.js" defer></script>
</head>

<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html" class="wf1">
      <label class="required" for="products">Product name</label>
      <select name="products" id="products" required>
        <option value="" disabled selected>Select a Product ... &#9662;</option>
      </select>
      <label class="required">Overall Rating</label>
      <div class="stars">
        <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar">★</label>
        <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar">★</label>
        <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar">★</label>
        <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar">★</label>
        <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar">★</label>
      </div>
      <label class="required" for="installationDate">Date of Installation</label>
      <input type="date" name="installationDate" id="installationDate">
      <fieldset><label>Which features did you find useful in the product? <span>(Check all that
            apply)</span></label>
        <div>
          <label for="durability"><input type="checkbox" name="durability" id="durability"
              value="yes">Durability</label>
          <label for="use"><input type="checkbox" name="use" id="use" value="yes">Ease of Use</label>
          <label for="performance"><input type="checkbox" name="performance" id="performance"
              value="yes">Performance</label>
          <label for="design"><input type="checkbox" name="design" id="design" value="yes">Design</label>
        </div>
      </fieldset>
      <label for="review" class="optional">Written Review </label>
      <textarea name="review" id="review"></textarea>
      <label for="name" class="optional">Your Name </label>
      <input type="text" name="name" id="name">

      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"> </span> -
      <span>Ovidio J. Luces M. - Venezuela - Bolivar</span>
    </p>
    <p id="lastModified">
    </p>
  </footer>
</body>

</html>
